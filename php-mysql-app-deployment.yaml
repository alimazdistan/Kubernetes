
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-mysql-app-deployment
spec:
  replicas: 3  
  selector:
    matchLabels:
      app: php-mysql-app
  template:
    metadata:
      labels:
        app: php-mysql-app
    spec:
      containers:
      - name: php-mysql-app
        image: alimazdistan1/php-mysql-app
        ports:
        - containerPort: 80
